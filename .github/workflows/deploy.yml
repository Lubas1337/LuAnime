name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "deploy/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/lubas1337/luwatch
  NAMESPACE: luwatch

jobs:
  build:
    runs-on: [self-hosted, lubax]
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.sha.outputs.short }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        env:
          TAG: ${{ steps.sha.outputs.short }}
        run: |
          docker build \
            --cache-from "$IMAGE:latest" \
            -t "$IMAGE:$TAG" -t "$IMAGE:latest" app/
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"

  deploy:
    needs: build
    runs-on: [self-hosted, lubax]
    env:
      TAG: ${{ needs.build.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy
        run: |
          helm upgrade luwatch ./deploy \
            --install \
            --namespace "$NAMESPACE" \
            --set "image.tag=$TAG" \
            --wait \
            --timeout 5m

      - name: Verify
        run: kubectl get pods -n "$NAMESPACE"
