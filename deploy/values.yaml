replicaCount: 1

image:
  repository: ghcr.io/lubas1337/luwatch
  tag: latest
  pullPolicy: Always

imagePullSecrets:
  - name: ghcr-creds

ingress:
  enabled: true
  className: traefik
  host: watch.lubax.net
  tls:
    secretName: lubax-net-wildcard-tls

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi

env:
  NODE_ENV: production
  HOSTNAME: "0.0.0.0"
